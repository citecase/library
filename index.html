<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiteCase Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        .book-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--accent);
        }

        .search-container {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        #loading-overlay {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
        }

        /* Brand Styling */
        .brand-cite {
            background-color: white;
            color: black;
            padding: 0 0.5rem;
            border: 1px solid #e2e8f0;
        }
        .brand-case {
            background-color: black;
            color: white;
            padding: 0 0.5rem;
        }
        .dark .brand-cite {
            border-color: #334155;
            background-color: #f1f5f9;
            color: black;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
            <p class="mt-4 text-white font-medium uppercase tracking-widest text-xs">Authenticating Repository...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-6 py-3 bg-slate-800 text-white text-xs font-bold uppercase tracking-widest rounded-full opacity-0 transition-opacity duration-300 hidden pointer-events-none">
        Link copied to clipboard
    </div>

    <!-- Theme Toggle (Floating) -->
    <div class="fixed top-4 right-4 z-50">
        <button id="theme-toggle" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm">
            <i class="fas fa-moon dark:hidden text-slate-600"></i>
            <i class="fas fa-sun hidden dark:inline text-yellow-400"></i>
        </button>
    </div>

    <!-- Header & Search -->
    <header class="search-container px-4 py-12 md:px-8">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center gap-8">
            <!-- Centralized Logo -->
            <div>
                <h1 class="text-5xl md:text-6xl font-bold serif flex items-center justify-center tracking-tight">
                    <span class="brand-cite">Cite</span><span class="brand-case">Case</span>
                </h1>
                <p class="text-sm text-slate-500 mt-6 uppercase tracking-[0.25em] font-bold" id="stats-label">
                    LAW LIBRARY
                </p>
            </div>

            <!-- Centralized Search -->
            <div class="w-full max-w-xl">
                <div class="relative">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search titles..." 
                        class="w-full pl-14 pr-6 py-4 bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-blue-500 rounded-2xl outline-none transition-all text-lg shadow-sm"
                    >
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12 md:px-8">
        <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected here -->
        </div>

        <!-- Unlock Section (Moved under titles) -->
        <div id="unlock-container" class="mt-12 flex flex-col items-center border-t border-slate-100 dark:border-slate-800 pt-12">
            <div id="unlock-section" class="flex flex-col items-center gap-4">
                <p class="text-[10px] uppercase tracking-[0.2em] font-bold text-slate-400">Unlock to Access Full Library</p>
                <div class="flex items-center gap-2">
                    <input 
                        type="text" 
                        id="lock-code" 
                        placeholder="••••••••" 
                        class="px-4 py-2 text-sm bg-transparent border-b border-slate-300 dark:border-slate-700 focus:border-blue-500 outline-none text-center tracking-widest"
                    >
                    <button id="unlock-btn" class="p-2 text-slate-400 hover:text-blue-600 transition-colors">
                        <i class="fas fa-key"></i>
                    </button>
                </div>
            </div>
            
            <div id="unlocked-badge" class="hidden text-[10px] text-green-500 font-bold uppercase tracking-[0.2em]">
                <i class="fas fa-unlock-alt mr-1"></i> Full Access Granted
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-search text-6xl text-slate-200 dark:text-slate-800 mb-4"></i>
            <h3 class="text-xl font-semibold text-slate-400">No documents found</h3>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-6xl mx-auto px-4 py-12 text-center text-xs text-slate-400 uppercase tracking-widest border-t border-slate-100 dark:border-slate-800 mt-12">
        <p>© CiteCase Library</p>
    </footer>

    <script>
        const MD_URL = 'https://raw.githubusercontent.com/citecase/library/refs/heads/main/ebooks.md';
        let allBooks = [];
        let isUnlocked = false;

        window.onload = async () => {
            initTheme();
            await fetchLibrary();
            document.getElementById('loading-overlay').classList.add('hidden');
        };

        async function fetchLibrary() {
            try {
                const response = await fetch(MD_URL);
                const text = await response.text();
                parseMarkdown(text);
                renderLibrary();
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('stats-label').innerText = "CONNECTION ERROR";
            }
        }

        function parseMarkdown(text) {
            const lines = text.split('\n');
            const bookRegex = /\[(.*?)\]\((.*?)\)/;
            
            allBooks = lines
                .map(line => {
                    const match = line.match(bookRegex);
                    if (match) {
                        let cleanTitle = match[1].trim();
                        cleanTitle = cleanTitle.replace(/\s*[\d\/]*PAGE\/.*$/i, '')
                                               .replace(/\s*\/MODE\/.*$/i, '')
                                               .replace(/_/g, ' ')
                                               .replace(/\s+/g, ' ')
                                               .trim();
                        
                        return { title: cleanTitle, url: match[2].trim() };
                    }
                    return null;
                })
                .filter(item => item !== null && item.title.length > 0);
        }

        function renderLibrary(filteredBooks = null) {
            const grid = document.getElementById('library-grid');
            const emptyState = document.getElementById('empty-state');
            const unlockContainer = document.getElementById('unlock-container');
            grid.innerHTML = '';

            let booksToDisplay = filteredBooks || allBooks;

            // If locked and not searching, only show 6
            if (!isUnlocked && !filteredBooks) {
                booksToDisplay = allBooks.slice(0, 6);
                unlockContainer.classList.remove('hidden');
            } else if (isUnlocked) {
                unlockContainer.classList.remove('hidden');
            } else if (filteredBooks) {
                unlockContainer.classList.add('hidden');
            }

            if (booksToDisplay.length === 0) {
                emptyState.classList.remove('hidden');
                unlockContainer.classList.add('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            booksToDisplay.forEach((book) => {
                const card = document.createElement('div');
                card.className = 'book-card p-6 rounded-2xl group cursor-pointer relative';
                
                card.innerHTML = `
                    <div class="flex flex-col justify-between h-full">
                        <div class="flex justify-between items-start mb-6">
                             <h2 class="text-[14px] font-semibold leading-relaxed group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors pr-4">
                                ${book.title}
                            </h2>
                            <i class="fas fa-arrow-right text-[10px] text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all mt-1 shrink-0"></i>
                        </div>
                        <div class="flex justify-end">
                            <button class="share-btn p-2 -mr-2 text-slate-300 hover:text-blue-500 transition-colors" title="Share Document">
                                <i class="fas fa-share-nodes text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;

                // Card click opens book
                card.onclick = () => window.open(book.url, '_blank');

                // Share button logic
                const shareBtn = card.querySelector('.share-btn');
                shareBtn.onclick = (e) => {
                    e.stopPropagation(); // Don't open book
                    copyToClipboard(book.url);
                };

                grid.appendChild(card);
            });
        }

        function copyToClipboard(text) {
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Document link copied");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
            }, 10);

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }

        // Lock Code Logic
        document.getElementById('unlock-btn').onclick = () => {
            attemptUnlock();
        };

        document.getElementById('lock-code').onkeypress = (e) => {
            if (e.key === 'Enter') attemptUnlock();
        };

        function attemptUnlock() {
            const input = document.getElementById('lock-code');
            const code = input.value.trim();
            
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const correctCode = `${d}${m}${y}`;
            
            if (code === correctCode) {
                isUnlocked = true;
                document.getElementById('unlock-section').classList.add('hidden');
                document.getElementById('unlocked-badge').classList.remove('hidden');
                renderLibrary();
            } else {
                input.classList.add('border-red-500');
                input.value = "";
                setTimeout(() => {
                    input.classList.remove('border-red-500');
                }, 1000);
            }
        }

        // Search Logic
        document.getElementById('search-input').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            if (term === "") {
                renderLibrary();
                return;
            }
            const filtered = allBooks.filter(book => 
                book.title.toLowerCase().includes(term)
            );
            renderLibrary(filtered);
        };

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        document.getElementById('theme-toggle').onclick = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
        };

    </script>
</body>
</html>
