<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiteCase Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }

        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .serif {
            font-family: 'Playfair Display', serif;
        }

        .book-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--accent);
        }

        .search-container {
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        #loading-overlay {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
            <p class="mt-4 text-white font-medium">Curating Legal Documents...</p>
        </div>
    </div>

    <!-- Header & Search -->
    <header class="sticky top-0 z-40 search-container px-4 py-6 md:px-8">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold serif flex items-center gap-3">
                    <i class="fas fa-balance-scale text-blue-600"></i>
                    CiteCase Library
                </h1>
                <p class="text-sm text-slate-500 mt-1" id="stats-label">Fetching records...</p>
            </div>

            <div class="flex items-center gap-3 flex-1 md:max-w-md">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search titles..." 
                        class="w-full pl-11 pr-4 py-3 bg-slate-100 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    >
                </div>
                <button id="theme-toggle" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:inline"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 md:px-8">
        <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards injected here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-book-open text-6xl text-slate-300 mb-4"></i>
            <h3 class="text-xl font-semibold">No documents found</h3>
            <p class="text-slate-500">Try adjusting your search terms.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-6xl mx-auto px-4 py-12 text-center text-sm text-slate-500 border-t border-slate-200 dark:border-slate-800 mt-12">
        <p>© CiteCase Library - Open Legal Repository</p>
    </footer>

    <script>
        const MD_URL = 'https://raw.githubusercontent.com/citecase/library/refs/heads/main/ebooks.md';
        let allBooks = [];

        // Initialization
        window.onload = async () => {
            initTheme();
            await fetchLibrary();
            document.getElementById('loading-overlay').classList.add('hidden');
        };

        async function fetchLibrary() {
            try {
                const response = await fetch(MD_URL);
                const text = await response.text();
                parseMarkdown(text);
                renderLibrary(allBooks);
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('stats-label').innerText = "Connection Error. Please refresh.";
            }
        }

        function parseMarkdown(text) {
            const lines = text.split('\n');
            const bookRegex = /\[(.*?)\]\((.*?)\)/;
            
            allBooks = lines
                .map(line => {
                    const match = line.match(bookRegex);
                    if (match) {
                        let cleanTitle = match[1].trim();
                        
                        // REMOVE ARCHIVE TAGS: strips patterns like /PAGE/N111/MODE/2UP, etc.
                        cleanTitle = cleanTitle.replace(/\s*[\d\/]*PAGE\/.*$/i, '')
                                               .replace(/\s*\/MODE\/.*$/i, '')
                                               .trim();
                        
                        return {
                            title: cleanTitle,
                            url: match[2].trim()
                        };
                    }
                    return null;
                })
                .filter(item => item !== null && item.title.length > 0);
            
            updateStats(allBooks.length);
        }

        function renderLibrary(books) {
            const grid = document.getElementById('library-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (books.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            books.forEach((book) => {
                const card = document.createElement('div');
                card.className = 'book-card p-6 rounded-2xl group cursor-pointer';
                
                card.innerHTML = `
                    <div class="flex flex-col h-full">
                        <div class="flex justify-between items-start mb-2">
                             <h2 class="text-base font-semibold leading-snug group-hover:text-blue-600 transition-colors pr-4">
                                ${book.title}
                            </h2>
                            <i class="fas fa-external-link-alt text-xs text-slate-300 group-hover:text-blue-500 transition-colors mt-1 shrink-0"></i>
                        </div>
                    </div>
                `;

                card.onclick = () => window.open(book.url, '_blank');
                grid.appendChild(card);
            });
        }

        function updateStats(count) {
            document.getElementById('stats-label').innerText = `${count} Legal documents indexed.`;
        }

        // Search Logic
        document.getElementById('search-input').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allBooks.filter(book => 
                book.title.toLowerCase().includes(term)
            );
            renderLibrary(filtered);
        };

        // Theme Toggle Logic
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        document.getElementById('theme-toggle').onclick = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
        };

    </script>
</body>
</html>
